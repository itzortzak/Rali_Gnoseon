name: Validate, deploy and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publish-rali-gnoseon
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and questions
        run: python3 tests/validate.py
      - name: Validate version metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          version = Path("VERSION").read_text(encoding="utf-8").strip()
          assert re.fullmatch(r"[0-9]+\.[0-9]+(?:\.[0-9]+)?", version), "Invalid VERSION"
          notes = Path(f"RELEASE_NOTES_v{version}.md")
          assert notes.is_file(), f"Missing release notes: {notes}"
          assert notes.stat().st_size > 0, f"Empty release notes: {notes}"
          print(f"Release metadata valid for v{version}")
          PY
  pages:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the version declared in VERSION
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          notes="RELEASE_NOTES_v${version}.md"
          archive="Rali_Gnoseon_3D_v${version//./_}.zip"
          test -s "$notes"
          zip -q "$archive" index.html questions.json 'Απαντήσεις_και_παραπομπές.txt' README.md VERSION "$notes"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
      - name: Publish release only for a new version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
          RELEASE_NOTES: ${{ steps.package.outputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::Release $RELEASE_TAG already exists; bump VERSION and create matching release notes for a new release."
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" --target "$GITHUB_SHA" --title "Ράλι Γνώσεων 3D $RELEASE_TAG" --notes-file "$RELEASE_NOTES" --latest
          fi
